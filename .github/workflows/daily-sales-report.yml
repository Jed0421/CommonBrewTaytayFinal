name: Daily sales report
on:
  schedule:
    - cron: '0 13 * * *'
  workflow_dispatch:
    inputs:
      preview:
        description: Preview without emailing
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: daily-sales-report
  cancel-in-progress: false
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --include=dev
      - name: Generate report
        env:
          PREVIEW: ${{ inputs.preview }}
          DAILY_SALES_REPORT_EMAIL: ${{ secrets.DAILY_SALES_REPORT_EMAIL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          if [ "$PREVIEW" = "true" ]; then
            npx --no-install tsx scripts/dailySalesReport.ts --dry-run >/dev/null
            echo "Report generated successfully."
          else
            npx --no-install tsx scripts/dailySalesReport.ts
          fi
